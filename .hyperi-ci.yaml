#
# TypeScript application variant in the hyperi-ci test matrix. No TS
# library variant currently — none in production use yet. This repo
# specifically exercises the buildx + GHCR push path for Node-based
# server apps.

language: typescript

runners:
  default: ubuntu-latest

quality:
  enabled: true

test:
  enabled: true

build:
  enabled: true
  type: app

publish:
  enabled: true
  target: oss
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
