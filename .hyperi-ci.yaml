#
# TypeScript application variant in the hyperi-ci test matrix. No TS
# library variant currently — none in production use yet.

language: typescript

quality:
  enabled: true

test:
  enabled: true
  coverage: true

build:
  enabled: true
  strategies:
    - native

publish:
  enabled: true
  target: oss
  container:
    enabled: true
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64

typescript:
  package_manager: auto
