name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/ts-ci.yml@main
    with:
      publish-target: oss
    secrets: inherit
